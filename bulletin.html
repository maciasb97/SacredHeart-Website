<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulletins - SHBCC</title>
  <link rel="stylesheet" href="style.css">
  
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
<!--Links in header from js file-->
    <div id="header"></div>

    <!--Bulletin Page Header with Logo Display-->
    <div class="bulletin-hero">
        <div class="bulletin-hero-text">
            <h1>Bulletins</h1>
        </div>
    </div>

    <!--Bulletin Page Main Content-->
    <section class="bulletin">
        <div class="bulletin-container-box">
            <div class="bulletin-container">
                <!--Bulletin list will be populated by JS-->
                <div id="bulletin-list"></div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
